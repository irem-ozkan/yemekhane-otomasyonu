    <link rel="stylesheet" href="/css/temel.css">
    <script src="/js/uygulama.js" defer></script>
</head>

<body data-sayfa="bakiye">

    <header>
        <div class="kapsayici ust">

            <strong>🍽 Yemekhane Otomasyonu</strong>

            <span id="oturumBilgi"></span>

            <button id="cikis" class="dugme ikincil" hidden>
                Çıkış
            </button>

        </div>
    </header>

    <nav class="kapsayici" aria-label="Ana menü">

        <a href="/index.html">Giriş</a>

    </nav>

    <main class="kapsayici">

        <h1>Bakiye İşlemleri</h1>

        <p id="bildirim" role="status" aria-live="polite"></p>

        <!-- GÜNCEL BAKİYE BİLGİSİ -->
        <div id="bakiyeBilgi"></div>

        <!-- BAKİYE YÜKLEME FORMU -->
        <form id="bakiyeForm">

            <label>
                Yüklenecek tutar (TL)

                <input
                    type="number"
                    name="tutar"
                    min="10"
                    max="1000"
                    step="0.01"
                    required
                >
            </label>

            <button class="dugme">
                Bakiye Yükle
            </button>

        </form>

        <!-- BAKİYE HAREKETLERİ -->
        <h2>İşlem Geçmişi</h2>

        <div id="icerik"></div>

    </main>

    <footer class="kapsayici">
        Yemekhane Otomasyonu · Web Teknolojileri
    </footer>
