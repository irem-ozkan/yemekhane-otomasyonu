            <label>
                Yemekhane

                <select id="yemekhaneFiltre">
                    <option value="">Tümü</option>
                </select>
            </label>

            <label>
                Öğün

                <select id="ogunFiltre">
                    <option value="">Tümü</option>
                </select>
            </label>

        </div>

        <!-- GÜNLÜK MENÜ KARTLARI -->
        <div id="icerik" class="kartlar"></div>

    </main>

    <footer class="kapsayici">
        Yemekhane Otomasyonu · Web Teknolojileri
